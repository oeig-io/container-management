# Gate Container Configuration
# Used by launch.sh to create and configure access-gate containers
# Caddy listens on port 80 inside the container; TLS belongs to the ingress

# Container naming
PREFIX="gate"

# Port configuration
# Final port = PORT_BASE + container_number (e.g., gate-01 -> 9701)
PORT_BASE=9700
CONNECT_PORT=80

# Resource limits
MEMORY="2GiB"
CPU=2
DISK="10GiB"

# Pre-seed configuration (not needed - everything is in nixpkgs)
SEED_DIR="/opt/gate-seed"
SEED_FILE=""

# Installation paths
INSTALL_PATH="/opt/gate-install"
INSTALLER_REPO="../install-gate"

# Health check configuration
# An unknown host must get 404 - the catch-all site proves Caddy is serving
HEALTH_ENDPOINT="http://localhost/"
HEALTH_EXPECTED=404
HEALTH_TIMEOUT=60
HEALTH_INTERVAL=5
