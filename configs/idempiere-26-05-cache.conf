# iDempiere Container Configuration
# Demonstrates launching from a LOCAL cached image instead of the images: remote.
# Use this when the images: remote no longer publishes the release you need
# (e.g., an older NixOS release retired upstream) but a copy is still cached
# locally. List local images/fingerprints with `incus image list`.

# Container naming
PREFIX="id"

# Use a locally cached NixOS 26.05 image by fingerprint (not the images: remote).
# Replace with your own cached fingerprint/alias from `incus image list`.
NIXOS_IMAGE="a96a7efb6265"

# Port configuration
# Final port = PORT_BASE + container_number (e.g., id-47 -> 9047)
PORT_BASE=9000
CONNECT_PORT=443

# Resource limits
MEMORY="4GiB"
CPU=2
DISK="20GiB"

# Pre-seed configuration (optional)
# Set SEED_FILE="" to skip pre-seeding
SEED_DIR="/opt/idempiere-seed"
SEED_FILE="idempiereServer13Daily.gtk.linux.x86_64.zip"

# Installation paths
INSTALL_PATH="/opt/idempiere-install"
INSTALLER_REPO="../install-idempiere"

# Health check configuration
HEALTH_ENDPOINT="http://localhost:8080/api/v1/auth/tokens"
HEALTH_EXPECTED=405
HEALTH_TIMEOUT=90
HEALTH_INTERVAL=5