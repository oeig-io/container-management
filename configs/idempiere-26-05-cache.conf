# iDempiere Container Configuration
# Pins NixOS 26.05. incus caches the image locally after the first pull, so
# subsequent launches avoid a remote fetch automatically. To force a specific
# cached build, replace the value with a local fingerprint or alias.

# Container naming
PREFIX="id"

# NixOS 26.05 (current standard across our repos)
NIXOS_IMAGE="images:nixos/26.05"

# Port configuration
# Final port = PORT_BASE + container_number (e.g., id-47 -> 9047)
PORT_BASE=9000
CONNECT_PORT=443

# Resource limits
MEMORY="4GiB"
CPU=2
DISK="20GiB"

# Pre-seed configuration (optional)
# Set SEED_FILE="" to skip pre-seeding
SEED_DIR="/opt/idempiere-seed"
SEED_FILE="idempiereServer13Daily.gtk.linux.x86_64.zip"

# Installation paths
INSTALL_PATH="/opt/idempiere-install"
INSTALLER_REPO="../install-idempiere"

# Health check configuration
HEALTH_ENDPOINT="http://localhost:8080/api/v1/auth/tokens"
HEALTH_EXPECTED=405
HEALTH_TIMEOUT=90
HEALTH_INTERVAL=5