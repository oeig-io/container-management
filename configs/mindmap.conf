# mindmap.conf - Apache AGE graph database (ERP Commons mind map)

# Container naming
# The install-* contract suggests a short prefix for disposable boxes
# (mb-01, fga-01). This one is the full word: the container is the mind
# map's graph store, and "mindmap-01" says what it is without a lookup.
# launch.sh validates the name against this prefix, so new instances are
# mindmap-01, mindmap-02, and so on.
PREFIX="mindmap"

# Port configuration
# Final port = PORT_BASE + container_number (e.g., mindmap-01 -> 9501)
PORT_BASE=9500
CONNECT_PORT=5432

# Resource limits
MEMORY="2GiB"
CPU=2
DISK="10GiB"

# Pre-seed (optional)
SEED_DIR="/opt/mindmap-seed"
SEED_FILE=""  # Skip pre-seeding

# Installation paths
INSTALL_PATH="/opt/mindmap-install"
INSTALLER_REPO="../install-mindmap"

# Health check
# No HTTP endpoint: postgres does not speak HTTP, and launch.sh's probe is
# an HTTP status check. install.sh performs the authoritative verification
# instead — postgres ready, mindmap-init completed, and a real cypher()
# query returning. A catalog check would pass on a graph that cannot be
# queried (see install-mindmap/CLAUDE.md).
HEALTH_ENDPOINT=""
HEALTH_TIMEOUT=0
HEALTH_INTERVAL=5
