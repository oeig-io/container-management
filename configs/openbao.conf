# openbao.conf - OpenBao secrets manager

# Container naming
PREFIX="bao"

# Port configuration
# Final port = PORT_BASE + container_number (e.g., bao-01 -> 9301)
PORT_BASE=9300
CONNECT_PORT=8200

# Resource limits
MEMORY="2GiB"
CPU=2
DISK="10GiB"

# Pre-seed (optional)
SEED_DIR="/opt/openbao-seed"
SEED_FILE=""  # Skip pre-seeding

# Installation paths
INSTALL_PATH="/opt/openbao-install"
INSTALLER_REPO="../install-openbao"

# Health check
# 200 once initialized and unsealed (501 uninitialized, 503 sealed)
HEALTH_ENDPOINT="http://localhost:8200/v1/sys/health"
HEALTH_EXPECTED=200
HEALTH_TIMEOUT=120
HEALTH_INTERVAL=5
