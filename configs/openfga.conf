# openfga.conf - OpenFGA authorization server

# Container naming
PREFIX="fga"

# Port configuration
# Final port = PORT_BASE + container_number (e.g., fga-01 -> 9401)
PORT_BASE=9400
CONNECT_PORT=8080

# Resource limits
MEMORY="2GiB"
CPU=2
DISK="10GiB"

# Pre-seed (optional)
SEED_DIR="/opt/openfga-seed"
SEED_FILE=""  # Skip pre-seeding

# Installation paths
INSTALL_PATH="/opt/openfga-install"
INSTALLER_REPO="../install-openfga"

# Health check
# Probes the plain-HTTP prometheus endpoint, not the API. The API is HTTPS
# with a container-local self-signed CA, and launch.sh runs curl without
# --cacert, so an https probe would report 000 — indistinguishable from a
# dead server, making the gate a false positive. install.sh performs the
# authoritative /healthz check with --cacert before this step runs.
HEALTH_ENDPOINT="http://localhost:2112/metrics"
HEALTH_EXPECTED=200
HEALTH_TIMEOUT=180
HEALTH_INTERVAL=5
